name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install CPU-only PyTorch (compatible across Python 3.8/3.9/3.10)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dev dependencies (excluding torch already installed)
        run: |
          pip install \
            numpy \
            opencv-python-headless \
            PyYAML \
            tqdm \
            scipy \
            scikit-learn \
            matplotlib \
            timm \
            easydict \
            black==24.1.1 \
            flake8==7.0.0 \
            isort==5.13.2 \
            pytest==7.4.4 \
            pytest-cov==4.1.0

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503,E501,E741,E402

      - name: Check import order with isort
        run: |
          isort --check-only --diff src/ tests/ --profile black

      - name: Check formatting with black
        run: |
          black --check src/ tests/ --line-length 100

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
        if: always()
