# =========================================================================
# FAIR1M dataset configuration
# =========================================================================
_base_: "default.yaml"

experiment:
  name: "odfe_obm_oacl_fair1m"

dataset:
  name: "FAIR1M"
  root: "data/FAIR1M"
  train_images: "data/FAIR1M/train/images"
  val_images: "data/FAIR1M/val/images"
  train_annotations: "data/FAIR1M/train/labelXml"
  val_annotations: "data/FAIR1M/val/labelXml"
  num_classes: 37
  class_names: [
    "Boeing737", "Boeing747", "Boeing777", "Boeing787", "A220", "A321",
    "A330", "A350", "ARJ21", "other-airplane",
    "Passenger Ship", "Motorboat", "Fishing Boat", "Tugboat", "other-ship",
    "Engineering Ship", "Liquid Cargo Ship", "Dry Cargo Ship", "Warship",
    "Small Car", "Bus", "Cargo Truck", "Dump Truck", "other-vehicle",
    "Van", "Trailer", "Tractor", "Excavator", "Truck Tractor",
    "Baseball Field", "Basketball Court", "Football Field", "Tennis Court",
    "Roundabout", "Intersection", "Bridge", "other"
  ]
  input_size: [800, 800]

training:
  epochs: 120
  batch_size: 8
  lr_decay_epochs: [60, 100]

optimizer:
  lr: 0.01
  momentum: 0.937
  weight_decay: 5.0e-4

evaluation:
  batch_size: 8

inference:
  input_size: [800, 800]

reporting:
  tail_categories: ["Tugboat", "Warship", "Excavator", "ARJ21", "Roundabout"]
  head_categories: ["Small Car", "Van", "Boeing737", "Tennis Court"]
