# =========================================================================
# Default / base configuration.
# Dataset-specific configs (dior.yaml, dota.yaml, fair1m.yaml) override
# these values. Loaded first by src/utils/config.py, then merged.
# =========================================================================

experiment:
  name: "odfe_obm_oacl_base"
  seed: 42
  seeds_for_multiseed_run: [42, 123, 2024]
  output_dir: "outputs"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  results_dir: "results"
  deterministic: false        # true = fully reproducible, slower

hardware:
  device: "cuda"               # "cuda" or "cpu"
  gpu_ids: [0]
  num_workers: 8
  pin_memory: true
  mixed_precision: true        # AMP

model:
  backbone: "yolov8-csp"        # YOLOv8-style single-stage baseline
  feature_levels: ["P3", "P4", "P5"]
  pretrained: false
  pretrained_weights: null

# ---------------------------------------------------------------------
# Optimization Difficulty Score (tau) — shared signal for ODFE/OBM/OACL
# tau_i^(t) = g_i^(t) * (1 + delta_i^(t) + kappa_i^(t)),  EMA-smoothed
# ---------------------------------------------------------------------
tau:
  ema_decay: 0.9               # beta; effective window = 1/(1-beta) = 10 iters
  epsilon: 1.0e-6               # numerical stability constant
  warmup_iters: 100             # iterations before tau is considered reliable

odfe:
  enabled: true
  feature_levels: 3             # P3, P4, P5

obm:
  enabled: true
  temperature: 2.0              # softens/sharpens the difficulty-proportional distribution
  mosaic_prob: 1.0               # probability that mosaic (vs. standard aug) is applied at all

oacl:
  enabled: true
  loss_weight: 0.5              # lambda in L_final = L_loc + lambda * L_cls
  max_sample_weight: 3.0         # w_max bound
  base_loss: "bce"               # binary cross-entropy per-sample

invariance_regularization:
  enabled: false
  coefficient: 0.01              # mu in L_final = L_loc + lambda*L_cls + mu*L_inv

loss:
  localization: "ciou"
  cls_weight: 0.5
  loc_weight: 1.0

optimizer:
  type: "sgd"
  lr: 0.01
  momentum: 0.937
  weight_decay: 5.0e-4
  nesterov: true
  grad_clip_norm: 10.0

lr_schedule:
  type: "step"
  gamma: 0.1
  warmup_epochs: 3
  warmup_lr_init: 1.0e-4

augmentation:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.5
  scale_jitter: [0.5, 1.5]
  color_jitter:
    brightness: 0.4
    contrast: 0.4
    saturation: 0.4
  mixup:
    enabled: true
    prob: 0.1
    alpha: 0.1
  mosaic:
    enabled: true
    strategy: "obm"              # "obm" | "standard" | "none"

inference:
  nms_iou_threshold: 0.65
  conf_threshold: 0.001
  max_detections: 300

evaluation:
  metric: "mAP@0.5"
  iou_thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

logging:
  log_interval: 50               # iterations
  save_interval: 1               # epochs
  use_tensorboard: true
  use_wandb: false
  wandb_project: "odfe-obm-oacl-rs-detection"
