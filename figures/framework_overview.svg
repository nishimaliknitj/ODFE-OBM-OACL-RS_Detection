<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Input -->
  <rect x="370" y="20" width="160" height="40" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="450" y="45" text-anchor="middle" font-size="13" fill="#1a1a1a">Optical RS Image Input</text>

  <line x1="450" y1="60" x2="450" y2="90" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OBM -->
  <rect x="320" y="90" width="260" height="42" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="450" y="108" text-anchor="middle" font-size="12" fill="#1a1a1a">Optimization-Balanced Mosaic (OBM)</text>
  <text x="450" y="123" text-anchor="middle" font-size="11" fill="#555">P_i &#8733; &#964;_i^(t)</text>

  <line x1="450" y1="132" x2="450" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backbone + Neck -->
  <rect x="330" y="160" width="240" height="42" rx="6" fill="#fff8e1" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="#1a1a1a">YOLOv8-style Backbone + FPN Neck</text>
  <text x="450" y="193" text-anchor="middle" font-size="11" fill="#555">produces {P3, P4, P5}</text>

  <line x1="450" y1="202" x2="450" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ODFE -->
  <rect x="270" y="230" width="360" height="46" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="450" y="250" text-anchor="middle" font-size="12" fill="#1a1a1a">Optimization-Driven Feature Emphasis (ODFE)</text>
  <text x="450" y="266" text-anchor="middle" font-size="11" fill="#555">&#945;_l &#8733; g_l^(t) &#183; (1 + s_l^(t))</text>

  <line x1="450" y1="276" x2="450" y2="304" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Multi-scale detect heads -->
  <rect x="150" y="304" width="150" height="40" rx="6" fill="#eef2f7" stroke="#5f6368" stroke-width="1.2"/>
  <text x="225" y="329" text-anchor="middle" font-size="12">P3/8 &#8594; Detect</text>

  <rect x="375" y="304" width="150" height="40" rx="6" fill="#eef2f7" stroke="#5f6368" stroke-width="1.2"/>
  <text x="450" y="329" text-anchor="middle" font-size="12">P4/16 &#8594; Detect</text>

  <rect x="600" y="304" width="150" height="40" rx="6" fill="#eef2f7" stroke="#5f6368" stroke-width="1.2"/>
  <text x="675" y="329" text-anchor="middle" font-size="12">P5/32 &#8594; Detect</text>

  <line x1="225" y1="344" x2="225" y2="372" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="450" y1="344" x2="450" y2="372" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="675" y1="344" x2="675" y2="372" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="225" y1="372" x2="675" y2="372" stroke="#333" stroke-width="1.2"/>
  <line x1="450" y1="372" x2="450" y2="392" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- OACL -->
  <rect x="280" y="392" width="340" height="46" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="450" y="412" text-anchor="middle" font-size="12" fill="#1a1a1a">Optimization-Aware Classification Loss (OACL)</text>
  <text x="450" y="428" text-anchor="middle" font-size="11" fill="#555">L_cls^(i) = -w_i &#183; [y log p + (1-y) log(1-p)]</text>

  <line x1="450" y1="438" x2="450" y2="466" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Combined loss -->
  <rect x="300" y="466" width="300" height="42" rx="6" fill="#f3e8fd" stroke="#a142f4" stroke-width="1.5"/>
  <text x="450" y="484" text-anchor="middle" font-size="12" fill="#1a1a1a">L_final = L_loc (CIoU) + &#955; &#183; L_cls</text>
  <text x="450" y="499" text-anchor="middle" font-size="11" fill="#555">&#955; = 0.5</text>

  <!-- tau box on the side, feeding all three modules -->
  <rect x="30" y="230" width="180" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="120" y="252" text-anchor="middle" font-size="12" font-weight="bold">&#964;_i^(t) (shared)</text>
  <text x="120" y="270" text-anchor="middle" font-size="10">g_i^(t): gradient sensitivity</text>
  <text x="120" y="285" text-anchor="middle" font-size="10">&#948;_i^(t): convergence instab.</text>
  <text x="120" y="300" text-anchor="middle" font-size="10">&#954;_i^(t): curvature proxy</text>
  <text x="120" y="315" text-anchor="middle" font-size="9" fill="#777">EMA-smoothed, &#946;=0.9</text>

  <!-- dashed lines from tau to OBM, ODFE, OACL -->
  <line x1="120" y1="230" x2="320" y2="111" stroke="#f9ab00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="210" y1="253" x2="270" y2="253" stroke="#f9ab00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="150" y1="320" x2="290" y2="410" stroke="#f9ab00" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="650" y="470" width="220" height="120" rx="6" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="662" y="490" font-size="11" font-weight="bold">Legend</text>
  <rect x="662" y="498" width="14" height="10" fill="#e6f4ea" stroke="#34a853"/>
  <text x="682" y="507" font-size="10">OBM (augmentation)</text>
  <rect x="662" y="514" width="14" height="10" fill="#fce8e6" stroke="#ea4335"/>
  <text x="682" y="523" font-size="10">ODFE (feature emphasis)</text>
  <rect x="662" y="530" width="14" height="10" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="682" y="539" font-size="10">OACL (loss reweighting)</text>
  <rect x="662" y="546" width="14" height="10" fill="#fef7e0" stroke="#f9ab00" stroke-dasharray="2,2"/>
  <text x="682" y="555" font-size="10">shared &#964; signal (dashed)</text>
  <rect x="662" y="562" width="14" height="10" fill="#f3e8fd" stroke="#a142f4"/>
  <text x="682" y="571" font-size="10">combined training objective</text>

  <text x="450" y="612" text-anchor="middle" font-size="10" fill="#888">Figure: ODFE + OBM + OACL framework overview (see paper Figure 1 / Figure 2)</text>
</svg>
